<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - CreatorKid</title>
    <meta name="description" content="Browse and download premium presets, templates, UI kits, and fonts for your creative projects.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/logo/logo_creator_kid.png" alt="Logo" class="nav-logo-img">
                Creator<span>Kid</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="resources.html" class="active">Resources</a></li>
                <li><a href="prompts.html">Prompts</a></li>
                <li><a href="downloads.html">Downloads</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
            <div class="nav-actions">
                <a href="https://t.me/+yFJLDj00U0MyMmQ1" target="_blank" class="btn btn-cta"><i class="fab fa-telegram-plane"></i> Join Now</a>
                <button class="hamburger"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <main>
        <section class="container" style="padding-top: 3rem; padding-bottom: 2rem;">
            <div style="text-align: center; margin-bottom: 3rem;">
                <h1>Premium <span class="text-gradient">Resources</span></h1>
                <p style="color: var(--text-muted); max-width: 600px; margin: 1rem auto 0;">Enhance your workflow with our hand-picked selection of high-quality assets.</p>
            </div>

            <!-- Search -->
            <div class="search-container fade-in">
                <i class="fas fa-search"></i>
                <input type="text" id="resource-search" class="search-input" placeholder="Search resources, presets, fonts, ID...">
            </div>

            <!-- Filters -->
            <div class="filters fade-in" style="animation-delay: 0.1s;">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="presets">Presets</button>
                <button class="filter-btn" data-filter="templates">Templates</button>
                <button class="filter-btn" data-filter="brushes">Brushes</button>
                <button class="filter-btn" data-filter="fonts">Fonts</button>
                <button class="filter-btn" data-filter="gradients">Gradients</button>
                <button class="filter-btn" data-filter="mockups">Mockups</button>
            </div>

            <!-- Ad Area -->
            <div class="ad-banner">
                <span>AdSense Inline Area (728x90)</span>
            </div>

            <!-- Resources Grid -->
            <div class="grid grid-3" id="resources-grid">
                <!-- Populated by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top: none;">
                &copy; 2024 CreatorKid. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/search.js"></script>
    <script src="js/filter.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('resources-grid');
            
            // Initial Render
            renderItems(getInitialData(resources), container, renderResourcesCard);

            // Setup Search
            setupSearch('#resource-search', renderResourcesCard, resources, '#resources-grid');

            // Setup Filters
            setupFilters('.filter-btn', '.card', '#resources-grid');
        });
    </script>


</body>
</html>
